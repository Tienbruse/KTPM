name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          python -m compileall chatbot services/company_search_service

      - name: Unit tests
        run: |
          if [ -f "test.py" ]; then python -m pytest; else echo "No tests"; fi

      - name: Build containers
        run: |
          docker build -f chatbot/Dockerfile .
          docker build -f services/company_search_service/Dockerfile .
