[project]
name = "company-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiobreaker>=1.2.0",
    "aiohttp>=3.11.12",
    "dotenv>=0.9.9",
    "elasticsearch>=8.8.0,<9.0.0",
    "fastapi>=0.115.8",
    "langchain>=0.3.19",
    "langchain-deepseek>=0.1.2",
    "langchain-openai>=0.3.6",
    "langgraph>=0.2.74",
    "openai>=1.64.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pre-commit>=4.1.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "streamlit>=1.42.2",
    "uvicorn>=0.34.0",
]

[tool.isort]
profile = "black"
known_first_party = ["company_search_service", "chatbot", "services", "src"]
combine_as_imports = true
